<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Séances">
<title>Séances</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; background: #f4f4f4; color: #111; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .imgs { display: flex; gap: 6px; margin: 6px 0; }
  .imgs img { height: 110px; width: auto; max-width: 48%; border-radius: 6px; object-fit: contain; background: #fff; }
  .meta { font-size: 13px; color: #555; margin-bottom: 8px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 3px; text-align: center; font-size: 13px; }
  th { background: #f0f0f0; }
  td.serie, th.serie { position: sticky; left: 0; background: #fafafa; text-align: left; min-width: 110px; z-index: 1; }
  td.serie small { display: block; color: #0a5; font-weight: 600; }
  select { width: 62px; font-size: 16px; padding: 6px 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #111; }
  select.d { width: 84px; }
  select.rempli { background: #e8f3ff; border-color: #2a7de1; }
  select.res { width: 100%; min-width: 96px; background: #eee; border-color: #aaa; }
  select.res.f { background: #e3f6e8; border-color: #2f9e55; }
  select.res.d { background: #fde6e6; border-color: #d14343; }
  .ligne { margin: 8px 0; font-size: 15px; }
  #dest { font-size: 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 200px; }
  #syn-texte { height: 190px; background: #f6f6f6; margin: 8px 0; }
  select:focus { outline: 2px solid #2a7de1; }
  .tools { margin-top: 20px; }
  button { font-size: 15px; padding: 8px 12px; margin-right: 8px; border-radius: 8px; border: 1px solid #999; background: #fff; }
  textarea { width: 100%; height: 90px; margin-top: 8px; font-size: 13px; }
  #onglets { display: flex; gap: 8px; margin: 0 0 12px; }
  #onglets button { flex: 1; margin: 0; padding: 10px 6px; font-size: 15px; }
  #onglets button.actif { background: #2a7de1; border-color: #2a7de1; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<h1>Séances</h1>
<div id="onglets"></div>
<div id="app"></div>

<div class="card" id="syn">
  <h2 id="syn-titre">Synthèse pour le coach</h2>
  <div class="meta">Choisissez les entraînements à envoyer.</div>
  <div class="ligne">De l'entraînement <select id="de"></select> à <select id="a"></select></div>
  <div class="ligne">Destinataire <input id="dest" type="tel" inputmode="tel" placeholder="06 12 34 56 78" autocomplete="off"></div>
  <textarea id="syn-texte" readonly></textarea>
  <button id="env">Envoyer par message</button><button id="cop">Copier</button>
</div>

<div class="tools">
  <button id="exp">Exporter</button>
  <button id="imp">Importer</button>
  <textarea id="box" placeholder="Export : copiez ce texte. Import : collez-le ici puis appuyez sur Importer."></textarea>
</div>

<script>
// ---- Outils pour fabriquer les listes ----
function plage(a, b, pas) { const r = []; for (let v = a; v <= b; v += pas) r.push(v); return r; }
const NB_ENTRAINEMENTS = 8;

// Listes déroulantes (valeur enregistrée = nombre ; libellé affiché = valeur + unité)
const L_MIN  = { vals: plage(5, 15, 5),  unite: " min" };   // durée en minutes
const L_SEC  = { vals: plage(5, 30, 5),  unite: " s" };     // durée en secondes
const liste = (a, b) => ({ vals: plage(a, b, 1), unite: "" });

// ---- Programme Full body ----
// type "duree" : une liste par série ; type "chgrep" : deux listes (Chg, Rep) par série
const EXERCICES = [
  { id: "ex1", titre: "1 - Tapis roulant ou elliptique", type: "duree", series: 1,
    prescrit: "15 min", repos: "", lDuree: L_MIN },
  { id: "ex2", titre: "2 - Planche sur coudes", type: "duree", series: 6,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Abdos tendus, dos droit, tête haute, coudes sous les épaules." },
  { id: "ex3", titre: "3 - Arc du corps sur le ventre extension bras", type: "duree", series: 6,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Couché sur le ventre, bras et épaules à 90°, cambrez le corps, omoplates serrées. Extensions et flexions des bras." },
  { id: "ex4", titre: "4 - Lat pulldown prise supination", type: "chgrep", series: 4,
    prescrit: "12-15 rép × 30 kg", repos: "Repos 01:30", lRep: liste(10, 20), lChg: liste(25, 35),
    consigne: "Garder le dos droit. Prise supination." },
  { id: "ex5", titre: "5 - Rowing sur poulie prise neutre", type: "chgrep", series: 4,
    prescrit: "12-15 rép × 25 kg", repos: "Repos 01:30", lRep: liste(10, 20), lChg: liste(20, 30),
    consigne: "Dos droit, genoux légèrement fléchis, abdos tendus. Tirer en gardant les bras près du corps, paumes vers l'intérieur." },
  { id: "ex6", titre: "6 - Renforcement fessiers - pont", type: "duree", series: 8,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Couché sur le dos, genoux fléchis. À l'expiration, lever les fesses, bassin stable, omoplates au sol. Retour contrôlé." },
  { id: "ex7", titre: "7 - DB développé militaire assis", type: "chgrep", series: 3,
    prescrit: "15-20 rép × 8 kg", repos: "Repos 01:00", lRep: liste(10, 25), lChg: liste(6, 12),
    consigne: "Assis, dos droit, abdos gainés. Pousser les haltères à la verticale au-dessus de la tête, puis revenir." },
  { id: "ex8", titre: "8 - DB Sit 90 Side Raise Neutral", type: "chgrep", series: 3,
    prescrit: "15-20 rép × 6 kg", repos: "Repos 01:00", lRep: liste(10, 25), lChg: liste(3, 9),
    consigne: "Assis, dos à 90°, haltères en prise neutre, coudes légèrement fléchis. Lever jusqu'à hauteur des oreilles." },
  { id: "ex9", titre: "9 - Extension coudes sur câble", type: "chgrep", series: 8,
    prescrit: "8 rép × 20 kg", repos: "Repos 00:45", lRep: liste(6, 10), lChg: liste(15, 25),
    consigne: "Debout, corps incliné, barre en supination sur poulie haute. Coudes fixes, faire des extensions. Dos droit." },
  { id: "ex10", titre: "10 - Dumbbell biceps curl prise neutre", type: "chgrep", series: 8,
    prescrit: "8 rép × 20 kg", repos: "Repos 00:45", lRep: liste(6, 10), lChg: liste(15, 25),
    consigne: "Debout, genoux légèrement fléchis. Flexions de coudes, paumes vers soi (prise marteau). Dos droit, abdos tendus." }
];

// ---- Programme Cardio / abdos golf (identifiants cg1 à cg6) ----
// types : "duree", "chgrep", + "chgdur" (charge + durée) et "tapis" (durée + vitesse + pente)
const L_SEC2   = { vals: plage(10, 45, 5), unite: " s" };
const L_SEC40  = { vals: plage(30, 50, 5), unite: " s" };
const L_MIN_T  = { vals: plage(15, 35, 5), unite: " min" };
const L_VIT    = { vals: [3.5, 4, 4.5, 5, 5.5, 6], unite: " km/h" };
const L_PENTE  = liste(3, 10);
const EXERCICES_CG = [
  { id: "cg1", titre: "1 - Elliptique", type: "duree", series: 1, sansRessenti: true,
    prescrit: "10 min", repos: "", lDuree: L_MIN, consigne: "Échauffement." },
  { id: "cg2", titre: "2 - Planche sur coudes", type: "duree", series: 8,
    prescrit: "30 s", repos: "Repos 00:15", lDuree: L_SEC2,
    consigne: "Abdos tendus, dos droit, tête haute, coudes sous les épaules." },
  { id: "cg3", titre: "3 - Allongement de bras avant avec élastique", type: "chgrep", series: 6,
    prescrit: "10 rép × 25 kg", repos: "Repos 01:00", lRep: liste(6, 14), lChg: liste(15, 35),
    consigne: "Abdos tendus, dos droit. Avec une tension dans l'élastique, allonger les bras vers l'avant et ramener les mains près du corps. Élastique perpendiculaire à l'allongement des bras." },
  { id: "cg4", titre: "4 - Déplacement avant avec dumbbell dans une main", type: "chgdur", series: 6,
    prescrit: "40 s × 12 kg", repos: "Repos 00:20", lChg: liste(8, 16), lDuree: L_SEC40,
    consigne: "Dos droit, tête haute, abdos tendus. Prendre le dumbbell au sol à côté du pied en fléchissant les genoux, puis marcher vers l'avant en le gardant près de soi." },
  { id: "cg5", titre: "5 - Arc du corps sur le ventre extension bras", type: "duree", series: 8,
    prescrit: "30 s", repos: "Repos 00:15", lDuree: L_SEC2,
    consigne: "Couché sur le ventre, bras et épaules à 90°, cambrez le corps, omoplates serrées. Extensions et flexions des bras." },
  { id: "cg6", titre: "6 - Tapis roulant", type: "tapis", series: 1,
    prescrit: "25 min · 4,5 km/h · pente 7", repos: "", lDuree: L_MIN_T, lVit: L_VIT, lPen: L_PENTE }
];
const SEANCES = [
  { id: "fb", nom: "Full body",           exercices: EXERCICES },
  { id: "cg", nom: "Cardio / abdos golf", exercices: EXERCICES_CG }
];

// ---- Stockage sur le téléphone ----
const KEY = "seances-fullbody-v1";
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { data = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
function cle(ex, serie, ent, ch) { return [ex, serie, ent, ch].join("|"); }

// Liste déroulante : "—" = vide. Une valeur déjà enregistrée mais absente de la liste
// (anciens essais) est ajoutée à la liste pour ne rien perdre.
function liste_deroulante(ex, serie, ent, ch, def, cls) {
  const k = cle(ex, serie, ent, ch);
  const s = document.createElement("select");
  if (cls) s.className = cls;
  const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "—"; s.appendChild(o0);
  const vals = def.vals.map(String);
  const cur = data[k];
  if (cur && !vals.includes(String(cur))) {
    const o = document.createElement("option"); o.value = cur; o.textContent = cur; s.appendChild(o);
  }
  def.vals.forEach(v => {
    const o = document.createElement("option");
    o.value = String(v); o.textContent = String(v).replace(".", ",") + def.unite; s.appendChild(o);
  });
  s.value = cur ? String(cur) : "";
  const maj = () => s.classList.toggle("rempli", s.value !== "");
  maj();
  s.addEventListener("change", () => {
    if (s.value === "") delete data[k]; else data[k] = s.value;
    save(); maj(); majRes(ex, ent); majSynthese();
  });
  return s;
}

// ---- Ressenti (visage + mot) ----
const RESSENTIS = [
  { v: "facile", label: "Facile", emoji: "😄" },
  { v: "bien",   label: "Bien",   emoji: "😐" },
  { v: "dur",    label: "Dur",    emoji: "😖" }
];
const TOUTES = SEANCES.flatMap(se => se.exercices);
const EX_PAR_ID = Object.fromEntries(TOUTES.map(x => [x.id, x]));
const RES = {};   // listes de ressenti : "exN|entraînement" -> <select>
const CHAMPS = ["chg", "rep", "duree", "vit", "pen"];
const NB_COL = { duree: 1, chgrep: 2, chgdur: 2, tapis: 3 };
const SOUS_ENT = { chgrep: ["Chg", "Rep"], chgdur: ["Chg", "Durée"], tapis: ["Durée", "Vit.", "Pente"] };

function aDesValeurs(ex, e) {
  for (let s = 1; s <= ex.series; s++)
    for (const ch of CHAMPS)
      if (data[cle(ex.id, s, e, ch)]) return true;
  return false;
}
// Ressenti visible seulement s'il y a des valeurs ; "Bien" par défaut (non enregistré tant qu'on n'a rien choisi)
function majRes(exId, e) {
  const ex = EX_PAR_ID[exId], sel = RES[exId + "|" + e];
  if (!sel) return;
  const k = cle(exId, "res", e, "ressenti");
  if (aDesValeurs(ex, e)) {
    sel.style.visibility = "visible";
    sel.value = data[k] || "bien";
  } else {
    sel.style.visibility = "hidden";
    if (k in data) { delete data[k]; save(); }
  }
  sel.classList.toggle("f", sel.value === "facile");
  sel.classList.toggle("d", sel.value === "dur");
}

// ---- Construction d'un exercice ----
function rendreExercice(ex, parent) {
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = "<h2></h2><div class='imgs'></div><div class='meta'></div><div class='scroll'></div>";
  (IMAGES[ex.id] || []).forEach(u => { const im = document.createElement('img'); im.src = u; im.alt = ex.titre; card.querySelector('.imgs').appendChild(im); });
  card.querySelector("h2").textContent = ex.titre;
  card.querySelector(".meta").textContent = [ex.repos, ex.consigne].filter(Boolean).join(" · ");
  const t = document.createElement("table");
  const nc = NB_COL[ex.type];

  let h1 = "<tr><th class='serie'>Entraîn.</th>", h2 = "";
  for (let e = 1; e <= NB_ENTRAINEMENTS; e++)
    h1 += nc > 1 ? `<th colspan='${nc}'>${e}</th>` : `<th>${e}</th>`;
  h1 += "</tr>";
  if (SOUS_ENT[ex.type]) {
    h2 = "<tr><th class='serie'></th>";
    for (let e = 1; e <= NB_ENTRAINEMENTS; e++) SOUS_ENT[ex.type].forEach(x => { h2 += "<th>" + x + "</th>"; });
    h2 += "</tr>";
  }
  t.innerHTML = h1 + h2;

  for (let s = 1; s <= ex.series; s++) {
    const tr = document.createElement("tr");
    const th = document.createElement("td"); th.className = "serie";
    th.innerHTML = `Série ${s}<small>${ex.prescrit}</small>`;
    tr.appendChild(th);
    for (let e = 1; e <= NB_ENTRAINEMENTS; e++) {
      const champs =
        ex.type === "chgrep" ? [["chg", ex.lChg, ""], ["rep", ex.lRep, ""]] :
        ex.type === "chgdur" ? [["chg", ex.lChg, ""], ["duree", ex.lDuree, "d"]] :
        ex.type === "tapis"  ? [["duree", ex.lDuree, "d"], ["vit", ex.lVit, "d"], ["pen", ex.lPen, ""]] :
                               [["duree", ex.lDuree, "d"]];
      champs.forEach(([ch, def, cls]) => {
        const c = document.createElement("td");
        c.appendChild(liste_deroulante(ex.id, s, e, ch, def, cls));
        tr.appendChild(c);
      });
    }
    t.appendChild(tr);
  }
  // Ligne Ressenti (sous la dernière série), sauf pour l'échauffement
  if (!ex.sansRessenti) {
    const trR = document.createElement("tr");
    const thR = document.createElement("td"); thR.className = "serie"; thR.textContent = "Ressenti";
    trR.appendChild(thR);
    for (let e = 1; e <= NB_ENTRAINEMENTS; e++) {
      const c = document.createElement("td");
      if (nc > 1) c.colSpan = nc;
      const sel = document.createElement("select"); sel.className = "res";
      RESSENTIS.forEach(r => {
        const o = document.createElement("option");
        o.value = r.v; o.textContent = r.emoji + " " + r.label; sel.appendChild(o);
      });
      sel.addEventListener("change", () => {
        data[cle(ex.id, "res", e, "ressenti")] = sel.value; save();
        majRes(ex.id, e); majSynthese();
      });
      RES[ex.id + "|" + e] = sel;
      c.appendChild(sel); trR.appendChild(c);
    }
    t.appendChild(trR);
  }
  card.querySelector(".scroll").appendChild(t);
  parent.appendChild(card);
}

const app = document.getElementById("app");
const conteneurs = {}, boutons = {};
const barre = document.getElementById("onglets");
SEANCES.forEach(se => {
  const d = document.createElement("div"); d.id = "s-" + se.id; app.appendChild(d); conteneurs[se.id] = d;
  se.exercices.forEach(ex => rendreExercice(ex, d));
  const b = document.createElement("button"); b.textContent = se.nom;
  b.addEventListener("click", () => afficherSeance(se));
  barre.appendChild(b); boutons[se.id] = b;
});

// ---- Synthèse pour le coach (une par séance) ----
const zone = document.getElementById("syn-texte");
const selDe = document.getElementById("de"), selA = document.getElementById("a");
const dest = document.getElementById("dest");
for (let i = 1; i <= NB_ENTRAINEMENTS; i++) {
  selDe.add(new Option(i, i)); selA.add(new Option(i, i));
}
selDe.value = "1"; selA.value = "4";
try { dest.value = localStorage.getItem("seances-dest") || ""; } catch (e) {}
dest.addEventListener("input", () => { try { localStorage.setItem("seances-dest", dest.value); } catch (e) {} });
selDe.addEventListener("change", () => { if (+selDe.value > +selA.value) selA.value = selDe.value; majSynthese(); });
selA.addEventListener("change", () => { if (+selA.value < +selDe.value) selDe.value = selA.value; majSynthese(); });

const virg = v => String(v).replace(".", ",");
function valeursSeries(ex, e) {
  const vals = [];
  for (let s = 1; s <= ex.series; s++) {
    const g = ch => data[cle(ex.id, s, e, ch)];
    if (ex.type === "chgrep") {
      vals.push((g("chg") || "–") + "×" + (g("rep") || "–"));
    } else if (ex.type === "chgdur") {
      vals.push((g("chg") || "–") + "×" + (g("duree") ? g("duree") + " s" : "–"));
    } else if (ex.type === "tapis") {
      const p = [];
      if (g("duree")) p.push(g("duree") + " min");
      if (g("vit")) p.push(virg(g("vit")) + " km/h");
      if (g("pen")) p.push("pente " + g("pen"));
      vals.push(p.length ? p.join(", ") : "–");
    } else {
      vals.push(g("duree") ? g("duree") + ex.lDuree.unite : "–");
    }
  }
  while (vals.length > 1 && /^[–×]+$/.test(vals[vals.length - 1])) vals.pop();   // séries vides en fin de liste
  return vals;
}
function construireSynthese(se, a, b) {
  const L = ["Synthèse " + se.nom + ", " + (a === b ? "entraînement " + a : "entraînements " + a + " à " + b),
             "(charge en kg × répétitions ; durées en min ou s)", ""];
  let any = false;
  se.exercices.forEach(ex => {
    const bloc = [];
    for (let e = a; e <= b; e++) {
      if (!aDesValeurs(ex, e)) continue;
      let ligne = "Entr. " + e + " : " + valeursSeries(ex, e).join(ex.type === "tapis" ? "" : ", ") + ".";
      if (!ex.sansRessenti) {
        const rv = RESSENTIS.find(x => x.v === (data[cle(ex.id, "res", e, "ressenti")] || "bien"));
        ligne += " Ressenti : " + rv.emoji + " " + rv.label;
      }
      bloc.push(ligne);
    }
    if (bloc.length) { any = true; L.push(ex.titre); bloc.forEach(x => L.push(x)); L.push(""); }
  });
  if (!any) L.push("Aucune donnée saisie sur cette plage.");
  return L.join("\n").trim();
}
let seanceCourante = SEANCES[0];
function majSynthese() { zone.value = construireSynthese(seanceCourante, +selDe.value, +selA.value); }
function afficherSeance(se) {
  seanceCourante = se;
  SEANCES.forEach(x => { conteneurs[x.id].style.display = x === se ? "" : "none"; boutons[x.id].classList.toggle("actif", x === se); });
  document.getElementById("syn-titre").textContent = "Synthèse pour le coach – " + se.nom;
  try { localStorage.setItem("seances-onglet", se.id); } catch (e) {}
  majSynthese();
}

document.getElementById("env").onclick = () => {
  majSynthese();
  const n = dest.value.replace(/[^\d+]/g, "");
  location.href = "sms:" + n + "&body=" + encodeURIComponent(zone.value);
};
document.getElementById("cop").onclick = () => {
  majSynthese();
  const b = document.getElementById("cop");
  const ok = () => { b.textContent = "Copié"; setTimeout(() => b.textContent = "Copier", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(zone.value).then(ok, () => { zone.select(); });
  else { zone.select(); document.execCommand("copy"); ok(); }
};

// Initialisation : ressenti selon les valeurs déjà enregistrées, puis onglet mémorisé et synthèse
TOUTES.forEach(ex => { for (let e = 1; e <= NB_ENTRAINEMENTS; e++) majRes(ex.id, e); });
let ouvert = SEANCES[0];
try { ouvert = SEANCES.find(x => x.id === localStorage.getItem("seances-onglet")) || SEANCES[0]; } catch (e) {}
afficherSeance(ouvert);

// ---- Export / import (copie de secours) ----
const box = document.getElementById("box");
document.getElementById("exp").onclick = () => { box.value = JSON.stringify(data); box.select(); };
document.getElementById("imp").onclick = () => {
  try {
    const d = JSON.parse(box.value);
    if (typeof d !== "object" || d === null) throw 0;
    if (!confirm("Remplacer les données actuelles par celles collées ?")) return;
    data = d; save(); location.reload();
  } catch (e) { alert("Texte invalide."); }
};
</script>
