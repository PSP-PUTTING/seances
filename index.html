<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Séances">
<title>Séances</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; background: #f4f4f4; color: #111; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .meta { font-size: 13px; color: #555; margin-bottom: 8px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 3px; text-align: center; font-size: 13px; }
  th { background: #f0f0f0; }
  td.serie, th.serie { position: sticky; left: 0; background: #fafafa; text-align: left; min-width: 110px; z-index: 1; }
  td.serie small { display: block; color: #0a5; font-weight: 600; }
  select { width: 62px; font-size: 16px; padding: 6px 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #111; }
  select.d { width: 84px; }
  select.rempli { background: #e8f3ff; border-color: #2a7de1; }
  select:focus { outline: 2px solid #2a7de1; }
  .tools { margin-top: 20px; }
  button { font-size: 15px; padding: 8px 12px; margin-right: 8px; border-radius: 8px; border: 1px solid #999; background: #fff; }
  textarea { width: 100%; height: 90px; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<h1>Séance full body</h1>
<div id="app"></div>

<div class="tools">
  <button id="exp">Exporter</button>
  <button id="imp">Importer</button>
  <textarea id="box" placeholder="Export : copiez ce texte. Import : collez-le ici puis appuyez sur Importer."></textarea>
</div>

<script>
// ---- Outils pour fabriquer les listes ----
function plage(a, b, pas) { const r = []; for (let v = a; v <= b; v += pas) r.push(v); return r; }
const NB_ENTRAINEMENTS = 8;

// Listes déroulantes (valeur enregistrée = nombre ; libellé affiché = valeur + unité)
const L_MIN  = { vals: plage(5, 15, 5),  unite: " min" };   // durée en minutes
const L_SEC  = { vals: plage(5, 30, 5),  unite: " s" };     // durée en secondes
const liste = (a, b) => ({ vals: plage(a, b, 1), unite: "" });

// ---- Programme Full body ----
// type "duree" : une liste par série ; type "chgrep" : deux listes (Chg, Rep) par série
const EXERCICES = [
  { id: "ex1", titre: "1 - Tapis roulant ou elliptique", type: "duree", series: 1,
    prescrit: "15 min", repos: "", lDuree: L_MIN },
  { id: "ex2", titre: "2 - Planche sur coudes", type: "duree", series: 6,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Abdos tendus, dos droit, tête haute, coudes sous les épaules." },
  { id: "ex3", titre: "3 - Arc du corps sur le ventre extension bras", type: "duree", series: 6,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Couché sur le ventre, bras et épaules à 90°, cambrez le corps, omoplates serrées. Extensions et flexions des bras." },
  { id: "ex4", titre: "4 - Lat pulldown prise supination", type: "chgrep", series: 4,
    prescrit: "12-15 rép × 30 kg", repos: "Repos 01:30", lRep: liste(10, 20), lChg: liste(25, 35),
    consigne: "Garder le dos droit. Prise supination." },
  { id: "ex5", titre: "5 - Rowing sur poulie prise neutre", type: "chgrep", series: 4,
    prescrit: "12-15 rép × 25 kg", repos: "Repos 01:30", lRep: liste(10, 20), lChg: liste(20, 30),
    consigne: "Dos droit, genoux légèrement fléchis, abdos tendus. Tirer en gardant les bras près du corps, paumes vers l'intérieur." },
  { id: "ex6", titre: "6 - Renforcement fessiers - pont", type: "duree", series: 8,
    prescrit: "20 s", repos: "Repos 00:10", lDuree: L_SEC,
    consigne: "Couché sur le dos, genoux fléchis. À l'expiration, lever les fesses, bassin stable, omoplates au sol. Retour contrôlé." },
  { id: "ex7", titre: "7 - DB développé militaire assis", type: "chgrep", series: 3,
    prescrit: "15-20 rép × 8 kg", repos: "Repos 01:00", lRep: liste(10, 25), lChg: liste(6, 12),
    consigne: "Assis, dos droit, abdos gainés. Pousser les haltères à la verticale au-dessus de la tête, puis revenir." },
  { id: "ex8", titre: "8 - DB Sit 90 Side Raise Neutral", type: "chgrep", series: 3,
    prescrit: "15-20 rép × 6 kg", repos: "Repos 01:00", lRep: liste(10, 25), lChg: liste(3, 9),
    consigne: "Assis, dos à 90°, haltères en prise neutre, coudes légèrement fléchis. Lever jusqu'à hauteur des oreilles." },
  { id: "ex9", titre: "9 - Extension coudes sur câble", type: "chgrep", series: 8,
    prescrit: "8 rép × 20 kg", repos: "Repos 00:45", lRep: liste(6, 10), lChg: liste(15, 25),
    consigne: "Debout, corps incliné, barre en supination sur poulie haute. Coudes fixes, faire des extensions. Dos droit." },
  { id: "ex10", titre: "10 - Dumbbell biceps curl prise neutre", type: "chgrep", series: 8,
    prescrit: "8 rép × 20 kg", repos: "Repos 00:45", lRep: liste(6, 10), lChg: liste(15, 25),
    consigne: "Debout, genoux légèrement fléchis. Flexions de coudes, paumes vers soi (prise marteau). Dos droit, abdos tendus." }
];

// ---- Stockage sur le téléphone ----
const KEY = "seances-fullbody-v1";
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { data = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
function cle(ex, serie, ent, ch) { return [ex, serie, ent, ch].join("|"); }

// Liste déroulante : "—" = vide. Une valeur déjà enregistrée mais absente de la liste
// (anciens essais) est ajoutée à la liste pour ne rien perdre.
function liste_deroulante(ex, serie, ent, ch, def, cls) {
  const k = cle(ex, serie, ent, ch);
  const s = document.createElement("select");
  if (cls) s.className = cls;
  const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "—"; s.appendChild(o0);
  const vals = def.vals.map(String);
  const cur = data[k];
  if (cur && !vals.includes(String(cur))) {
    const o = document.createElement("option"); o.value = cur; o.textContent = cur; s.appendChild(o);
  }
  def.vals.forEach(v => {
    const o = document.createElement("option");
    o.value = String(v); o.textContent = v + def.unite; s.appendChild(o);
  });
  s.value = cur ? String(cur) : "";
  const maj = () => s.classList.toggle("rempli", s.value !== "");
  maj();
  s.addEventListener("change", () => {
    if (s.value === "") delete data[k]; else data[k] = s.value;
    save(); maj();
  });
  return s;
}

const app = document.getElementById("app");
EXERCICES.forEach(ex => {
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = "<h2></h2><div class='meta'></div><div class='scroll'></div>";
  card.querySelector("h2").textContent = ex.titre;
  card.querySelector(".meta").textContent = [ex.repos, ex.consigne].filter(Boolean).join(" · ");
  const t = document.createElement("table");

  let h1 = "<tr><th class='serie'>Entraîn.</th>", h2 = "";
  for (let e = 1; e <= NB_ENTRAINEMENTS; e++)
    h1 += ex.type === "chgrep" ? `<th colspan='2'>${e}</th>` : `<th>${e}</th>`;
  h1 += "</tr>";
  if (ex.type === "chgrep") {
    h2 = "<tr><th class='serie'></th>";
    for (let e = 1; e <= NB_ENTRAINEMENTS; e++) h2 += "<th>Chg</th><th>Rep</th>";
    h2 += "</tr>";
  }
  t.innerHTML = h1 + h2;

  for (let s = 1; s <= ex.series; s++) {
    const tr = document.createElement("tr");
    const th = document.createElement("td"); th.className = "serie";
    th.innerHTML = `Série ${s}<small>${ex.prescrit}</small>`;
    tr.appendChild(th);
    for (let e = 1; e <= NB_ENTRAINEMENTS; e++) {
      if (ex.type === "chgrep") {
        const c1 = document.createElement("td"), c2 = document.createElement("td");
        c1.appendChild(liste_deroulante(ex.id, s, e, "chg", ex.lChg));
        c2.appendChild(liste_deroulante(ex.id, s, e, "rep", ex.lRep));
        tr.appendChild(c1); tr.appendChild(c2);
      } else {
        const c = document.createElement("td");
        c.appendChild(liste_deroulante(ex.id, s, e, "duree", ex.lDuree, "d"));
        tr.appendChild(c);
      }
    }
    t.appendChild(tr);
  }
  card.querySelector(".scroll").appendChild(t);
  app.appendChild(card);
});

// ---- Export / import (copie de secours) ----
const box = document.getElementById("box");
document.getElementById("exp").onclick = () => { box.value = JSON.stringify(data); box.select(); };
document.getElementById("imp").onclick = () => {
  try {
    const d = JSON.parse(box.value);
    if (typeof d !== "object" || d === null) throw 0;
    if (!confirm("Remplacer les données actuelles par celles collées ?")) return;
    data = d; save(); location.reload();
  } catch (e) { alert("Texte invalide."); }
};
</script>
</body>
</html>
